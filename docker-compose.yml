
services:
  db:
    image: postgres:17
    container_name: hireloop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hireloop
      POSTGRES_USER: hireloop_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
